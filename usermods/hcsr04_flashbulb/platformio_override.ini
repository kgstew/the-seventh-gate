; The Seventh Gate — fleet firmware build
;
; Generated by .claude/epic/11-quinled-migration.md.  Do not hand-edit here;
; the source of truth is `usermods/hcsr04_flashbulb/README.md` in
; ~/Code/the-seventh-gate, which this file is a copy of.
;
; Target: QuinLED Dig-Next-2 (ESP32, 8MB flash) running WLED v16.0.1.
;
; NOTE ON THE VERSION TAG.  The repo documents the baseline as "0.16.1".  There
; is no v0.16.x tag upstream — WLED renumbered after v0.15.5, so the actual tag
; is **v16.0.1** (VERSION 2605010).  Same release, different numbering scheme.

[env:seventhgate]
extends = env:esp32dev_8M

; Overrides esp32dev_8M's `audioreactive`.  The fleet binary contains this
; usermod and nothing else — see 00-epic-summary.md, "Fleet firmware baseline".
; Dropping audioreactive also removes its claim on GPIO 32, which is Trig here.
custom_usermods = hcsr04_flashbulb

build_unflags = ${common.build_unflags}
build_flags = ${common.build_flags} ${esp32_idf_V4.build_flags}
  -D WLED_RELEASE_NAME=\"SEVENTHGATE\"
  -DARDUINO_USB_CDC_ON_BOOT=0
  ; Compiled-in default LED data pin, so a freshly flashed board lights the
  ; strip before cfg.json is uploaded.  cfg.json overrides this at runtime.
  ; QuinLED Dig-Next-2 LED out is GPIO 2 (output 1) / GPIO 4 (output 2).
  -D DATA_PINS=2

lib_deps = ${esp32_idf_V4.lib_deps}
monitor_filters = esp32_exception_decoder
